name: Build App (APK / AAB / iOS)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Android package name (applicationId) / iOS bundle id, e.g. com.acme.app. Empty keeps sweetmelon.yaml.'
        required: false
        default: ''
        type: string
      dart_package:
        description: 'Dart package name, e.g. my_app. Empty keeps sweetmelon.yaml.'
        required: false
        default: ''
        type: string
      app_name:
        description: 'App name shown under the icon. Empty keeps sweetmelon.yaml.'
        required: false
        default: ''
        type: string
      build_apk:
        description: 'Build an APK (armeabi-v7a + arm64-v8a)'
        required: false
        default: true
        type: boolean
      build_aab:
        description: 'Build an Android App Bundle (signed with a throw-away key, not uploadable to Play)'
        required: false
        default: false
        type: boolean
      build_ios:
        description: 'Build an iOS app without code signing (not installable; for compile checks)'
        required: false
        default: false
        type: boolean
      clean_build:
        description: 'Run flutter clean before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check-inputs:
    name: Check inputs
    runs-on: ubuntu-latest
    steps:
      - name: At least one output
        run: |
          if [ "${{ inputs.build_apk }}" != "true" ] && [ "${{ inputs.build_aab }}" != "true" ] && [ "${{ inputs.build_ios }}" != "true" ]; then
            echo "::error::Tick at least one of build_apk, build_aab, build_ios"
            exit 1
          fi

  build-android:
    name: Build Android
    needs: check-inputs
    if: ${{ inputs.build_apk || inputs.build_aab }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner image has ~14 GB free and the Android toolchain plus the
      # native plugin builds fill it; drop large tools this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Toolchain Info
        run: |
          java -version
          flutter --version

      # Package names, app name, plugins and permissions in one step. The CLI
      # validates every value and fails the job with a message when one is bad.
      - name: Prepare the project
        uses: ./.github/actions/prepare
        with:
          package_name: ${{ inputs.package_name }}
          dart_package: ${{ inputs.dart_package }}
          app_name: ${{ inputs.app_name }}

      - name: Clean Build Cache (Optional)
        if: ${{ inputs.clean_build }}
        run: |
          flutter clean
          flutter pub get

      - name: Generate Self-Signed Keystore for Release Signing
        # A throw-away key created for this run only. For store releases, sign
        # with your own keystore instead (see android/app/build.gradle.kts).
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -genkey \
            -keystore android/app/release.jks \
            -storepass "$PASSWORD" \
            -alias sweetmelon \
            -keypass "$PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sweetmelon, OU=Mobile, O=Sweetmelon, L=Global, S=Global, C=US"

      - name: Build APK (armeabi-v7a + arm64-v8a)
        if: ${{ inputs.build_apk }}
        run: |
          export SWEETMELON_KEYSTORE_PATH="release.jks"
          export SWEETMELON_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export SWEETMELON_KEY_ALIAS="sweetmelon"
          export SWEETMELON_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          flutter build apk --release --target-platform android-arm,android-arm64

      - name: Build App Bundle
        if: ${{ inputs.build_aab }}
        run: |
          export SWEETMELON_KEYSTORE_PATH="release.jks"
          export SWEETMELON_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export SWEETMELON_KEY_ALIAS="sweetmelon"
          export SWEETMELON_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          flutter build appbundle --release

      - name: Verify the package name of the APK
        if: ${{ inputs.build_apk }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          ACTUAL="$("$AAPT" dump packagename "$APK")"
          echo "APK package: $ACTUAL"
          if [ -n "$PACKAGE_NAME" ] && [ "$ACTUAL" != "$PACKAGE_NAME" ]; then
            echo "::error::Expected package $PACKAGE_NAME but the APK has $ACTUAL"
            exit 1
          fi
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: sweetmelon-apk-${{ inputs.package_name != '' && inputs.package_name || 'default' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload App Bundle
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: sweetmelon-aab-${{ inputs.package_name != '' && inputs.package_name || 'default' }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

  build-ios:
    name: Build iOS (no code signing)
    needs: check-inputs
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare the project
        uses: ./.github/actions/prepare
        with:
          package_name: ${{ inputs.package_name }}
          dart_package: ${{ inputs.dart_package }}
          app_name: ${{ inputs.app_name }}

      - name: Clean Build Cache (Optional)
        if: ${{ inputs.clean_build }}
        run: |
          flutter clean
          flutter pub get

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Zip the app
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app ../../../Runner-app.zip

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: sweetmelon-ios-${{ inputs.package_name != '' && inputs.package_name || 'default' }}
          path: Runner-app.zip
          retention-days: 14
          if-no-files-found: error
