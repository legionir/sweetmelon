name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Android package name (applicationId), e.g. com.acme.app. Empty keeps the current one.'
        required: false
        default: ''
        type: string
      dart_package:
        description: 'Dart package name, e.g. my_app. Empty keeps the current one.'
        required: false
        default: ''
        type: string
      clean_build:
        description: 'Run flutter clean before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Signed Android APK (ARM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      DART_PACKAGE: ${{ inputs.dart_package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner image has ~14 GB free and the Android toolchain plus the
      # native plugin builds fill it; drop large tools this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Toolchain Info
        run: |
          java -version
          flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # The three project tools run before every build. The CLI validates the
      # names and fails the job with a message when one is not valid.
      - name: Rename the Android package (if requested)
        if: ${{ inputs.package_name != '' }}
        run: dart run bin/sweetmelon.dart rename --id "$PACKAGE_NAME" --apply --force

      - name: Rename the Dart package (if requested)
        if: ${{ inputs.dart_package != '' }}
        run: |
          dart run bin/sweetmelon.dart rename --dart-package "$DART_PACKAGE" --apply --force
          flutter pub get

      - name: Sync permissions and dependencies with sweetmelon.yaml
        # Adds the pubspec dependencies, Android permissions and iOS usage
        # descriptions that the enabled plugins need, and removes the rest.
        run: |
          dart run bin/sweetmelon.dart sync --apply --force
          flutter pub get

      - name: Clean Build Cache (Optional)
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: |
          flutter clean
          flutter pub get

      - name: Generate Self-Signed Keystore for Release Signing
        # A throw-away key created for this run only. For store releases, sign
        # with your own keystore instead (see android/app/build.gradle.kts).
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"
          echo "KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -genkey \
            -keystore android/app/release.jks \
            -storepass "$PASSWORD" \
            -alias sweetmelon \
            -keypass "$PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sweetmelon, OU=Mobile, O=Sweetmelon, L=Global, S=Global, C=US"

      - name: Build Signed Android Release APK (armeabi-v7a + arm64-v8a)
        run: |
          export SWEETMELON_KEYSTORE_PATH="release.jks"
          export SWEETMELON_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export SWEETMELON_KEY_ALIAS="sweetmelon"
          export SWEETMELON_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify the package name of the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          ACTUAL="$("$AAPT" dump packagename "$APK")"
          echo "APK package: $ACTUAL"
          if [ -n "$PACKAGE_NAME" ] && [ "$ACTUAL" != "$PACKAGE_NAME" ]; then
            echo "::error::Expected package $PACKAGE_NAME but the APK has $ACTUAL"
            exit 1
          fi
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweetmelon-apk-${{ inputs.package_name != '' && inputs.package_name || 'default' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
