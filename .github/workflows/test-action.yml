name: Test action (ref mode)

# Builds a small web app with the action in this repository, exactly as a
# project that uses `legionir/sweetmelon@<tag>` would.
on:
  push:
    branches: [main]
    paths:
      - action.yml
      - tool/ci/**
      - lib/cli/**
      - bin/**
      - tests/fixtures/ref-app/**
      - examples/**
      - .github/workflows/test-action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ref-mode-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift

      - name: Build the fixture app
        id: build
        uses: ./
        with:
          target: apk
          www: tests/fixtures/ref-app/www
          config: tests/fixtures/ref-app/sweetmelon.yaml
          package_name: com.example.fromaction
          app_name: Action Demo
          artifact_name: ref-mode-apk

      - name: Check the result
        run: |
          test "${{ steps.build.outputs.package }}" = "com.example.fromaction"
          test -f "${{ steps.build.outputs.file }}"

  template-smoke:
    # init -> detect --strict -> prepare (dry run) -> upgrade, without a build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create an app and check it
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/smoke-app"
          dart run bin/sweetmelon.dart init "$APP" --package-name com.example.smoke --app-name "Smoke" --apply
          dart run bin/sweetmelon.dart detect --www "$APP/www" --strict | tee detect.txt
          grep -q "storage" detect.txt && grep -q "toast" detect.txt
          cd "$APP"
          dart run "$GITHUB_WORKSPACE/bin/sweetmelon.dart" upgrade --to 2.4.2 --apply
          grep -q "sweetmelon@v2.4.2" .github/workflows/build.yml
