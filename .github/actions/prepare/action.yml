name: Prepare Sweetmelon project
description: >
  Runs "sweetmelon prepare" (package names, app name, icon, plugin selection,
  sync) and then "flutter pub get". Empty inputs keep the values from
  sweetmelon.yaml.

inputs:
  package_name:
    description: Android package name / iOS bundle id
    default: ''
  dart_package:
    description: Dart package name
    default: ''
  app_name:
    description: Name shown under the app icon
    default: ''
  icon:
    description: Path of a square PNG (1024 px or more)
    default: ''
  www:
    description: Folder with the web app to inject into assets/www
    default: ''
  strict:
    description: Fail when a bridge call cannot be resolved to a plugin
    default: 'false'

runs:
  using: composite
  steps:
    - name: sweetmelon prepare
      shell: bash
      env:
        IN_PACKAGE_NAME: ${{ inputs.package_name }}
        IN_DART_PACKAGE: ${{ inputs.dart_package }}
        IN_APP_NAME: ${{ inputs.app_name }}
        IN_ICON: ${{ inputs.icon }}
        IN_WWW: ${{ inputs.www }}
        IN_STRICT: ${{ inputs.strict }}
      run: tool/ci/prepare.sh
